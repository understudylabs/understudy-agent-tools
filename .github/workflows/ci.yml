name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # Public skill surface: frontmatter present, thin SKILL.md (deep material
      # in reference.md / references/), no leaked private material.
      - name: Validate public skills
        run: uv run python scripts/validate_public_skills.py

      # Unit + CLI + gate tests (pythonpath=["."] in pyproject lets the suite
      # import scripts.*).
      - name: Tests
        run: uv run --with pytest pytest -q

      # Build sdist + wheel and inspect the archives.
      - name: Release smoke
        run: uv run python scripts/package_release_smoke.py
