<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>understudy / no-data ladder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪜</text></svg>">
<!--
  Understudy "no-data onboarding ladder" — static replay viewer (P0 prototype).
  Dependency-free. Loads the frozen fixture via <script src="ladder.data.js"></script>
  so it works on file:// (fetch() is blocked on the file: scheme). Reads window.LADDER
  (schema: understudy.ladder_report.v1). No network. No /api. No live model calls.
  Design tokens + transcript renderers are lifted from understudy-rollout-lab/static/index.html;
  the SSE transport is replaced by an in-memory replayEvents() driver.
-->
<style>
  :root{
    /* ---- lifted dark tokens (rollout-lab) ---- */
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3340;
    --txt:#e6edf3; --dim:#8b97a6; --dim2:#5c6675;
    --accent:#58a6ff; --think:#7d8590; --content:#e6edf3;
    --good:#3fb950; --bad:#f85149; --gold:#d29922; --reason:#a371f7;
    --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    --r-sm:6px; --r-md:8px; --r-lg:10px;
    --good-bg:#10210f; --bad-bg:#2a1214; --gold-bg:#241c0a; --accent-bg:#16263f;
    --shadow:0 8px 28px rgba(0,0,0,.45);
    /* ---- fallbacks for the vars the lifted CSS references but never defines ---- */
    --stamp:var(--accent); --ink:var(--txt); --ink-muted:var(--dim); --rule:var(--line);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;
    min-height:100vh}
  a{color:var(--accent)}

  /* ---------- shared primitives ---------- */
  .chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;
    border-radius:999px;font-size:10.5px;font-family:var(--mono);
    border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    white-space:nowrap;line-height:1.6}
  .chip.ok{color:var(--good);border-color:var(--good);background:var(--good-bg)}
  .chip.warn{color:var(--gold);border-color:var(--gold);background:var(--gold-bg)}
  .chip.err{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
  .chip.acc{color:var(--accent);border-color:var(--stamp);background:var(--accent-bg)}
  .sect{margin:20px 0 10px;font-size:12.5px;font-weight:600;color:var(--txt);
    letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .sect::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- masthead ---------- */
  header{padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    position:sticky;top:0;z-index:30;background:var(--bg)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:12px}
  header .stamp{color:var(--dim2);font-size:11px;font-family:var(--mono);margin-left:auto}

  /* ---------- persistent synthetic / local caveat banner ---------- */
  .caveat{position:sticky;top:49px;z-index:25;
    background:var(--gold-bg);border-bottom:1px solid var(--gold);
    color:var(--gold);font-size:12px;line-height:1.45;padding:8px 20px;
    display:flex;gap:10px;align-items:flex-start;font-family:var(--mono)}
  .caveat .ic{flex:none}
  .caveat b{color:#f1c75e}
  .caveat .det{color:var(--dim);margin-top:2px;display:block}

  /* ---------- sticky ladder rail ---------- */
  .rail{position:sticky;top:101px;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:10px 20px;
    display:flex;align-items:center;gap:6px;overflow-x:auto}
  .rung{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--dim);
    font-size:12px;white-space:nowrap;cursor:pointer;transition:all .2s;flex:none}
  .rung .dot{font-size:11px;line-height:1}
  .rung b{color:var(--txt);font-size:12px}
  .rung small{color:var(--dim2);font-size:10px}
  .rung.active{box-shadow:0 0 0 1px var(--accent) inset;border-color:var(--accent);
    background:var(--accent-bg)}
  .rung.active b{color:var(--txt)}
  .rung.pass{border-color:var(--good)}  .rung.pass .dot{color:var(--good)}
  .rung.partial{border-color:var(--gold)} .rung.partial .dot{color:var(--gold)}
  .rung.fail{border-color:var(--bad)}   .rung.fail .dot{color:var(--bad)}
  .rung.spectrum{border-color:var(--accent)} .rung.spectrum .dot{color:var(--accent)}
  .rung.locked{opacity:.45;cursor:not-allowed}
  .railarrow{color:var(--dim2);flex:none}

  /* ---------- main column ---------- */
  main{max-width:920px;margin:0 auto;padding:18px 20px 80px}
  .beat-title{font-size:18px;font-weight:700;margin:6px 0 2px;letter-spacing:.2px}
  .beat-title .tag{font-family:var(--mono);font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:999px;margin-right:9px;vertical-align:middle}
  .tag.easy{background:var(--good-bg);color:var(--good);border:1px solid var(--good)}
  .tag.medium{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold)}
  .tag.hard{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
  .tag.spectrum{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent)}
  .beat-type{font-family:var(--mono);color:var(--dim2);font-size:12px;margin:0 0 12px}

  /* plain-language explainer blocks (Granola #1 / #5) */
  .why{border:1px solid var(--line);border-left:3px solid var(--accent);
    background:var(--panel);border-radius:0 8px 8px 0;padding:11px 14px;margin:12px 0;
    font-size:13.5px;line-height:1.55}
  .why .lbl{display:block;font-size:9px;color:var(--accent);text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:5px;font-weight:600}
  .why.you-get-it{border-left-color:var(--good)}
  .why.you-get-it .lbl{color:var(--good)}
  .why.escalate{border-left-color:var(--gold)}
  .why.escalate .lbl{color:var(--gold)}
  .note{color:var(--dim);font-size:12px;line-height:1.5;margin:8px 0}
  .note b{color:var(--txt)}

  /* ---------- stage tracker (lifted .loop) ---------- */
  .loop{display:flex;align-items:center;gap:5px;padding:10px 0;overflow-x:auto;margin-top:4px}
  .stage{padding:5px 10px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel);color:var(--dim);font-size:12px;white-space:nowrap;
    transition:all .25s;display:flex;flex-direction:column;gap:1px;min-width:84px;flex:none}
  .stage b{color:var(--txt);font-size:12px}
  .stage small{font-size:10px;color:var(--dim2)}
  .stage.on{border-color:var(--accent);background:var(--accent-bg);color:var(--txt);
    box-shadow:0 0 0 1px var(--accent) inset}
  .stage.done{border-color:var(--good)}
  .arrow{color:var(--dim2)}

  /* ---------- transcript renderers (lifted) ---------- */
  #stream{padding:6px 0;min-height:80px}
  .role{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2);
    margin-bottom:4px;font-weight:600}
  .msg{margin-bottom:14px}
  .bubble{border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    background:var(--panel);white-space:pre-wrap;word-break:break-word;
    font-family:var(--mono);font-size:12.5px;line-height:1.5}
  .turnhdr{font-size:11px;color:var(--accent);font-weight:600;margin:18px 0 6px;
    border-top:1px dashed var(--line);padding-top:12px}
  .reason{color:var(--reason);opacity:.92;font-style:normal;
    border-left:2px solid var(--reason);padding-left:9px;margin-bottom:6px;
    font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;
    background:var(--panel);border-radius:0 6px 6px 0;padding:8px 9px}
  .reason .lbl{display:block;font-size:9px;color:var(--reason);opacity:.85;
    text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
  .content{white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.5;
    border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel);margin:6px 0}
  .content .lbl{display:block;font-size:9px;color:var(--dim2);text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:4px}
  .toolsavail{color:var(--dim2);font-size:11px;margin:2px 0 4px;font-family:var(--mono);
    border:1px dashed var(--line);border-radius:6px;padding:7px 9px;line-height:1.6}
  .toolsavail b{color:var(--dim)}
  .toolcall{border:1px solid var(--line);border-left:3px solid var(--accent);
    background:var(--panel);border-radius:0 6px 6px 0;padding:7px 11px;margin:8px 0 0;
    font-family:var(--mono);font-size:12px}
  .toolcall .nm{color:var(--accent);font-weight:600}
  .toolcall .args{color:var(--dim)}
  .toolcall .gloss{display:block;font-family:-apple-system,sans-serif;color:var(--dim2);
    font-size:11px;margin-top:5px;line-height:1.45;font-style:italic}
  .toolresult{border:1px solid var(--line);border-left:3px solid var(--good);
    background:var(--good-bg);border-radius:0 6px 6px 0;padding:7px 11px;margin:0 0 4px;
    font-family:var(--mono);font-size:11px;color:var(--dim);white-space:pre-wrap;
    max-height:160px;overflow:auto}
  .toolresult.err{border-left-color:var(--bad);background:var(--bad-bg);color:#e8a39c}
  .parsed{border:1px solid var(--line);border-left:3px solid var(--gold);
    background:var(--gold-bg);border-radius:0 6px 6px 0;padding:9px 11px;margin:8px 0;
    font-family:var(--mono);font-size:13px;letter-spacing:.5px}
  .parsed.ok{border-left-color:var(--good);background:var(--good-bg)}
  .parsed .lbl{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.6px;
    margin-bottom:4px;font-family:-apple-system,sans-serif;color:var(--dim2)}
  .parsed .verdict{font-weight:700}
  .parsed.ok .verdict{color:var(--good)} .parsed.bad .verdict{color:var(--bad)}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);
    vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- strict-score panel (HARD) ---------- */
  .scorecard{border:1px solid var(--line);border-radius:10px;background:var(--panel);
    padding:14px 16px;margin:14px 0}
  .scorehead{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .scorebig{font-family:var(--mono);font-weight:800;font-size:30px;line-height:1}
  .scorebig small{font-size:12px;color:var(--dim);font-weight:400;display:block;margin-top:3px}
  .scorebig.strict.zero{color:var(--bad)} .scorebig.strict.one{color:var(--good)}
  .scorebig.dense{color:var(--gold)}
  .explainer{border:1px dashed var(--line);border-radius:8px;background:var(--panel2);
    padding:9px 12px;margin:8px 0 12px;font-size:12px;line-height:1.55;color:var(--dim)}
  .explainer b{color:var(--txt)}
  .assertrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;
    border-top:1px solid var(--panel2)}
  .assertrow .v{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 7px;
    border-radius:4px;flex:none;margin-top:1px}
  .assertrow.pass .v{background:var(--good-bg);color:var(--good)}
  .assertrow.fail .v{background:var(--bad-bg);color:var(--bad)}
  .assertrow .body{flex:1;min-width:0}
  .assertrow .lab{color:var(--txt);font-size:13px;font-weight:600}
  .assertrow .neg{font-family:var(--mono);font-size:9px;color:var(--bad);
    border:1px solid var(--bad);border-radius:4px;padding:0 5px;margin-left:7px;vertical-align:middle}
  .assertrow .ea{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-top:3px}
  .assertrow .ea .exp{color:var(--good)} .assertrow .ea .act{color:var(--bad)}
  .assertrow .plain{color:var(--dim);font-size:12px;margin-top:4px;line-height:1.45}

  /* ---------- roster table ---------- */
  table.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:8px 0}
  table.tbl th,table.tbl td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
  table.tbl th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  table.tbl td .cls{font-size:10px;color:var(--dim2)}
  table.tbl tr.frontier td{color:var(--txt)}
  table.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  table.tbl .pass-y{color:var(--good)} table.tbl .pass-n{color:var(--bad)} table.tbl .pass-p{color:var(--gold)}
  .modelclass{display:inline-block;font-size:9px;font-family:var(--mono);padding:1px 6px;
    border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-left:6px}
  .modelclass.small-local{color:var(--good);border-color:var(--good)}
  .modelclass.mid-open{color:var(--gold);border-color:var(--gold)}
  .modelclass.frontier{color:var(--accent);border-color:var(--accent)}

  /* ---------- aggregate (MEDIUM) ---------- */
  .aggcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;margin:12px 0}
  .metricrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}
  .metric{flex:1;min-width:150px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:10px 12px}
  .metric .mname{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
  .metric .cmp{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-family:var(--mono)}
  .metric .cmp .lo{color:var(--bad);font-size:20px;font-weight:700}
  .metric .cmp .hi{color:var(--good);font-size:20px;font-weight:700}
  .metric .cmp .arr{color:var(--dim2)}
  .metric .leg{font-size:10px;color:var(--dim2);margin-top:3px;display:flex;justify-content:space-between}
  .recovery{border:1px solid var(--good);border-radius:8px;background:var(--good-bg);
    padding:10px 12px;margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--txt)}
  .recovery .lbl{display:block;font-size:9px;color:var(--good);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;font-family:var(--mono)}
  .recovery b{color:#7ee08a}

  /* ---------- spectrum: heatmap ---------- */
  .heat{overflow-x:auto;margin:10px 0}
  table.heatmap{border-collapse:collapse;font-family:var(--mono);font-size:11px}
  table.heatmap th{padding:6px 8px;color:var(--dim);font-weight:600;font-size:10.5px;text-align:center;white-space:nowrap}
  table.heatmap th.tasklabel{text-align:left}
  table.heatmap td{padding:4px;text-align:center}
  .hcell{display:block;border-radius:6px;padding:9px 6px;min-width:62px;font-weight:700;
    color:#0d1117;border:1px solid rgba(0,0,0,.25)}
  .hcell .hpartial{display:block;margin-top:2px;font-weight:600;font-size:8.5px;
    letter-spacing:.02em;opacity:.78}
  .hrow .tasklabel{text-align:left;padding:6px 10px 6px 0;white-space:nowrap}
  .hrow .tasklabel b{color:var(--txt);font-family:var(--mono);font-size:11.5px}
  .hrow .tasklabel small{display:block;color:var(--dim2);font-size:9.5px;font-family:-apple-system,sans-serif}
  .hrow.easy .tasklabel b{color:var(--good)}
  .hrow.medium .tasklabel b{color:var(--gold)}
  .hrow.hard .tasklabel b{color:var(--bad)}
  .heatlegend{display:flex;gap:14px;align-items:center;color:var(--dim2);font-size:11px;font-family:var(--mono);margin-top:6px;flex-wrap:wrap}
  .heatlegend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:4px}

  /* ---------- spectrum: headline / ferrari ---------- */
  .headline{border:1px solid var(--accent);border-radius:10px;background:var(--accent-bg);
    padding:16px 18px;margin:14px 0;font-size:15px;line-height:1.55}
  .headline .one{color:var(--txt);font-weight:600}
  .ferrari{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .ferrari .fl{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--dim)}
  .ferrari .fl .ic{flex:none;font-size:15px}
  .ferrari .fl b{color:var(--txt)}

  /* ---------- spectrum: open/closed tally ---------- */
  .tally{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 16px;margin:12px 0}
  .tallybars{display:flex;gap:10px;margin:10px 0 6px}
  .tb{flex:1;text-align:center;border-radius:8px;padding:12px 6px;font-family:var(--mono)}
  .tb .n{font-size:26px;font-weight:800;line-height:1}
  .tb .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
  .tb.tie{background:var(--panel2);color:var(--dim)}
  .tb.open{background:var(--good-bg);color:var(--good)}
  .tb.closed{background:var(--bad-bg);color:var(--bad)}

  /* ---------- advance gate ---------- */
  .gate{display:flex;gap:12px;align-items:center;margin:22px 0 6px;flex-wrap:wrap}
  button{background:var(--accent);color:var(--panel2);border:none;border-radius:var(--r-sm);
    padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;
    transition:filter .15s, box-shadow .15s;font-family:inherit}
  button:hover:not(:disabled){filter:brightness(1.12)}
  button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  button.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  button.secondary:hover:not(:disabled){background:var(--panel);filter:none}
  button.big{padding:13px 26px;font-size:15px}
  .gatehint{color:var(--dim2);font-size:12px;font-family:var(--mono)}

  /* ---------- Door-A CTA ---------- */
  .cta{border:1px solid var(--accent);border-radius:12px;background:var(--panel);
    padding:22px 24px;margin:18px 0;text-align:center}
  .cta h2{margin:0 0 8px;font-size:20px;color:var(--txt)}
  .cta p{color:var(--dim);font-size:14px;line-height:1.55;max-width:620px;margin:0 auto 16px}
  .cta .smallcaveat{color:var(--dim2);font-size:11.5px;font-family:var(--mono);margin-top:14px}

  /* stamps row (determinism honesty) */
  .stamps{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 2px}

  /* ---------- task dissector (collapsible, closed by default) ---------- */
  .dissect-toggle{display:inline-flex;align-items:center;gap:8px;margin:8px 0 2px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
    color:var(--dim);font-family:var(--mono);font-size:12px;padding:6px 12px;cursor:pointer}
  .dissect-toggle:hover{background:var(--panel2);color:var(--txt)}
  .dissect-toggle .glyph{color:var(--accent);font-weight:700;width:14px;text-align:center}
  .dissect-toggle[aria-expanded="true"]{border-color:var(--accent);color:var(--txt)}
  .dissect-body{border:1px solid var(--line);border-radius:0 0 var(--r-md) var(--r-md);
    border-top:none;background:var(--panel);padding:14px 16px;margin:0 0 14px}
  .dissect-body[hidden]{display:none}
  .dissect-tasks{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .dissect-tasks .chip{cursor:pointer}
  .dissect-tasks .chip[aria-pressed="true"]{color:var(--accent);border-color:var(--stamp);background:var(--accent-bg)}
  .dissect-sect{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
    font-weight:600;margin:14px 0 6px;border-bottom:1px solid var(--panel2);padding-bottom:4px}
  .dissect-sect:first-child{margin-top:0}
  .dissect-summary{font-size:13.5px;line-height:1.55;color:var(--txt);
    border-left:3px solid var(--dim2);padding:2px 0 2px 11px;margin:2px 0 4px}
  .dissect-row{display:flex;gap:10px;padding:5px 0;font-size:12.5px;line-height:1.5;border-top:1px solid var(--panel2)}
  .dissect-row:first-of-type{border-top:none}
  .dissect-row .k{color:var(--txt);font-weight:600;flex:none;min-width:140px}
  .dissect-row .v{color:var(--dim)}
  .dissect-tool .k{font-family:var(--mono);color:var(--accent);min-width:200px}
  .dissect-classlist{margin:6px 0 0 0;border-left:2px solid var(--panel2);padding-left:11px}
  .dissect-classlist .dissect-row .k{min-width:120px;font-family:var(--mono);font-size:11.5px}
  .dissect-success{border-left:3px solid var(--good);background:var(--good-bg);
    border-radius:0 6px 6px 0;padding:9px 12px;font-size:13px;line-height:1.55;color:var(--txt)}
  .driver{padding:8px 0;border-top:1px solid var(--panel2)}
  .driver:first-of-type{border-top:none}
  .driver-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .driver-dot{color:var(--gold)}
  .driver-name{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--txt);
    border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--panel2)}
  .driver-short{color:var(--dim);font-size:12.5px;flex:1;min-width:160px}
  .driver-where{margin-left:auto;background:none;border:1px solid var(--line);border-radius:var(--r-sm);
    color:var(--dim2);font-family:var(--mono);font-size:10px;padding:2px 8px;cursor:pointer}
  .driver-where[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
  .driver-detail[hidden]{display:none}
  .driver-detail{margin:6px 0 0 18px;padding:8px 11px;border-left:2px solid var(--line);
    background:var(--panel2);border-radius:0 6px 6px 0;font-size:12px;line-height:1.5;color:var(--dim)}
  .driver-detail b{color:var(--txt)}
  .driver-detail .why{border:none;background:none;padding:0;margin:0 0 6px;border-left:none}
  .driver-jump{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;
    color:var(--accent);cursor:pointer;text-decoration:underline dotted;background:none;border:none;padding:0}
  .dissect-foot{color:var(--dim2);font-family:var(--mono);font-size:10px;line-height:1.5;
    margin-top:14px;border-top:1px solid var(--panel2);padding-top:8px}
  .assertrow--flash{box-shadow:0 0 0 2px var(--accent);border-radius:6px;transition:box-shadow .2s}

  /* ---------- inline glossary (hover / click tooltips) ---------- */
  .gl{border-bottom:1px dotted var(--accent);cursor:help;outline:none}
  .gl:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:3px}
  #gl-pop{position:absolute;z-index:60;max-width:280px;background:var(--panel2);
    border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);
    padding:10px 12px;font-size:12px;line-height:1.5;color:var(--dim);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #gl-pop[hidden]{display:none}
  #gl-pop .gl-term{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);
    text-transform:none;letter-spacing:.2px;margin-bottom:5px;font-weight:700}
  #gl-pop .gl-why{display:block;margin-top:6px;color:var(--dim2);font-size:11px}
  #gl-pop.pinned{border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>understudy <span style="color:var(--dim2)">/</span> no-data ladder</h1>
  <span class="sub" id="sub">a difficulty ladder you can watch — no dataset required</span>
  <span class="stamp" id="stamp">loading fixture…</span>
</header>

<!-- persistent, never-dismissed synthetic/local caveat banner (Granola #8) -->
<div class="caveat" id="caveat">
  <span class="ic">🔒</span>
  <span>
    <b id="caveat-main">Synthetic tasks. Runs locally. Nothing uploaded.</b>
    <span class="det" id="caveat-det"></span>
  </span>
</div>

<!-- sticky ladder rail -->
<div class="rail" id="rail"></div>

<main>
  <div id="beat"><!-- beats render here --></div>
</main>

<!-- fixture: window.LADDER (understudy.ladder_report.v1). <script src> works on file://; fetch() does not. -->
<script src="ladder.data.js"></script>
<!-- task dissector: window.LADDER_ANATOMY + window.LADDER_GLOSSARY. Additive & optional —
     if this file is absent the dissector simply no-ops and the viewer still runs. file://-safe. -->
<script src="ladder.anatomy.js"></script>
<script>
"use strict";
/* ============================================================================
   Understudy no-data ladder — static replay viewer
   No network. No /api. No EventSource. Drives lifted renderers from window.LADDER.
   ========================================================================== */

const L = (typeof window!=='undefined' && window.LADDER) ? window.LADDER : null;
const $ = (s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtUsd(n){ if(n==null) return '—'; if(n===0) return '$0 (local)'; return '$'+(+n).toFixed(n<0.01?4:3); }
function fmtK(n){ if(n==null) return '—'; return n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'K' : ''+n; }

/* ---- guard: fixture missing (e.g. ladder.data.js not loaded) ---- */
if(!L){
  document.getElementById('beat').innerHTML =
    '<div class="why" style="border-left-color:var(--bad)"><span class="lbl" style="color:var(--bad)">fixture not loaded</span>'+
    'Could not find <code>window.LADDER</code>. Open <b>ladder.html</b> with <b>ladder.data.js</b> in the same folder. '+
    'No server is needed — double-clicking the file is enough.</div>';
  document.getElementById('stamp').textContent='no fixture';
}

/* ============================================================================
   chrome: caveat banner, determinism stamp, sticky rail
   ========================================================================== */
const RUNGS = [
  {id:'easy',   label:'EASY'},
  {id:'medium', label:'MEDIUM'},
  {id:'hard',   label:'HARD'},
  {id:'spectrum', label:'SPECTRUM'},
];
let maxUnlocked = 0;      // gated advance: rungs unlock left→right
let current = 0;

function tierById(id){ return (L.tiers||[]).find(t=>t.id===id) || null; }
function outcomeClass(id){
  if(id==='spectrum') return 'spectrum';
  const t=tierById(id);
  return t ? (t.demo_outcome==='pass'?'pass':t.demo_outcome==='partial'?'partial':'fail') : '';
}
function dotChar(id, idx){
  if(idx>maxUnlocked) return '○';
  if(idx===current) return '◉';
  return id==='spectrum' ? '◇' : '●';
}

function renderChrome(){
  if(!L) return;
  // caveat
  $('#caveat-main').textContent = 'Synthetic tasks. Runs locally. Nothing uploaded.';
  $('#caveat-det').textContent =
    (L.caveat || 'Results are on synthetic look-alike tasks, not your workload. Directional only — not a savings claim.')
    + ' These are invented "Larkfield" companies (*.larkfield.example) — no real inbox or account is touched.';
  // determinism stamp (Granola #6 — frozen, no live calls)
  const judge = (L.judge_model==null) ? 'no LLM judge' : ('judge '+L.judge_model);
  $('#stamp').textContent =
    `frozen replay · seed ${L.seed} · temp ${L.temperature} · ${judge}`;
  renderRail();
}

function renderRail(){
  const rail = $('#rail');
  rail.innerHTML='';
  RUNGS.forEach((r,i)=>{
    if(i>0){ const a=el('span','railarrow','→'); rail.appendChild(a); }
    const locked = i>maxUnlocked;
    const oc = outcomeClass(r.id);
    const rung = el('div','rung '+(oc)+(i===current?' active':'')+(locked?' locked':''));
    const t = tierById(r.id);
    rung.innerHTML =
      `<span class="dot">${dotChar(r.id,i)}</span>`+
      `<span><b>${esc(r.label)}</b>`+
      (r.id==='spectrum'
        ? '<small>the reveal</small>'
        : `<small>${esc(t?t.name:'')}</small>`)+
      `</span>`;
    rung.onclick = ()=>{ if(!locked) goTo(i); };
    rail.appendChild(rung);
  });
}

/* ============================================================================
   lifted transcript renderers (token / tool / parsed) — fed from arrays
   ========================================================================== */
let streamEl=null, curReasonEl=null, curContentEl=null, cursor=null;

function clearStream(){ if(streamEl){ streamEl.innerHTML=''; } curReasonEl=curContentEl=null; cursor=null; }
function placeCursor(e){ if(cursor)cursor.remove(); cursor=el('span','cursor'); e.appendChild(cursor); }
function dropCursor(){ if(cursor){cursor.remove();cursor=null;} }

function turnHeader(n){ const d=el('div','turnhdr','● the model takes turn '+n); streamEl.appendChild(d); curReasonEl=curContentEl=null; }

function reasonToken(t){
  if(!curReasonEl){ curReasonEl=el('div','reason',
    '<span class="lbl">reasoning (the model\'s private scratchpad — not shown to the user in production)</span><span class="txt"></span>');
    streamEl.appendChild(curReasonEl); }
  curReasonEl.querySelector('.txt').textContent += t;
}
function contentToken(t){
  if(!curContentEl){ curContentEl=el('div','content','<span class="lbl">reply (what the user would actually see)</span>');
    const sp=el('span','body'); curContentEl.appendChild(sp); streamEl.appendChild(curContentEl); placeCursor(sp); }
  const body=curContentEl.querySelector('.body');
  body.insertBefore(document.createTextNode(t), cursor);
}

function toolsAvail(names, glossText){
  const d=el('div','toolsavail');
  d.innerHTML='<b>🛠 tools the model is allowed to call:</b> '+esc((names||[]).join(', ')||'(none)');
  if(glossText){ const g=el('div',null,esc(glossText)); g.style.cssText='font-family:-apple-system,sans-serif;color:var(--dim2);margin-top:6px;font-style:italic;line-height:1.45'; d.appendChild(g); }
  streamEl.appendChild(d);
}
function toolCall(name,args,gloss){
  const d=el('div','toolcall');
  d.innerHTML=`🔧 <span class="nm">${esc(name)}</span><span class="args">(${esc(JSON.stringify(args||{}))})</span>`;
  if(gloss){ d.appendChild(el('span','gloss',esc(gloss))); }
  streamEl.appendChild(d);
}
function toolResult(result,ok){
  const d=el('div','toolresult'+(ok?'':' err'));
  const text = (typeof result==='object') ? (result.error || JSON.stringify(result)) : result;
  d.textContent='→ '+text;
  streamEl.appendChild(d);
}
function parsedRow(label,gold,correct){
  const d=el('div','parsed '+(correct?'ok':'bad'));
  d.innerHTML=`<span class="lbl">the model's answer, scored against the gold label</span>`+
    `<span class="verdict">${esc(label)}</span>`+
    (gold!=null && gold!==label ? ` <span style="color:var(--dim2)">— gold was <b style="color:var(--good)">${esc(gold)}</b></span>` : '')+
    (correct ? ' <span class="chip ok">correct</span>' : ' <span class="chip err">wrong</span>');
  streamEl.appendChild(d);
}

/* ---- stage tracker (lifted setStage/resetStages) ---- */
function setStage(name,state){ document.querySelectorAll('.stage').forEach(e=>{ if(e.dataset.s===name){ e.classList.remove('on','done'); if(state)e.classList.add(state);} }); }
function resetStages(){ document.querySelectorAll('.stage').forEach(e=>e.classList.remove('on','done')); }

/* ============================================================================
   replayEvents(arr, pace) — the in-memory driver that replaces EventSource
   Walks the frozen event array, dispatching each event to the lifted renderers
   with humane pacing so token streams feel live. Returns a controller.
   ========================================================================== */
function dispatch(ev, ctx){
  switch(ev.type){
    case 'meta':
      ctx.meta = ev;
      setStage('prompt','done'); setStage('policy','on');
      // tool-calling explainer surfaces here, before the first tool call (Granola #3)
      if(ev.tools_available && ev.tools_available.length){
        toolsAvail(ev.tools_available, ctx.toolGloss);
      }
      break;
    case 'turn_start':
      turnHeader(ev.turn||1); setStage('policy','on');
      break;
    case 'token':
      setStage('policy','on');
      if(ev.channel==='reasoning') reasonToken(ev.text||'');
      else contentToken(ev.text||'');
      break;
    case 'tool_call':
      setStage('policy','done'); setStage('env','on');
      toolCall(ev.tool||ev.name, ev.args, ev.gloss);
      break;
    case 'tool_result':
      setStage('env', ev.ok===false ? 'on':'done');
      toolResult(ev.result, ev.ok!==false);
      break;
    case 'parsed':
      setStage('parser','done');
      parsedRow(ev.label, ev.gold, ev.correct!==undefined?ev.correct:(ev.label===ev.gold));
      break;
    case 'reward':
      dropCursor();
      setStage('parser','done'); setStage('rubric','done');
      ctx.reward = ev;
      break;
    case 'done':
      dropCursor();
      setStage('rubric','done');
      ctx.done = ev;
      if(ctx.onDone) ctx.onDone(ev);
      break;
    default: break;
  }
}

function paceFor(ev){
  if(!ev) return 200;
  if(typeof ev.delay==='number') return ev.delay;
  switch(ev.type){
    case 'token':       return ev.channel==='reasoning'?9:16;
    case 'tool_call':   return 520;
    case 'tool_result': return 620;
    case 'turn_start':  return 340;
    case 'parsed':      return 520;
    case 'reward':      return 360;
    case 'meta':        return 280;
    default:            return 240;
  }
}

let activeTimer=null;
function replayEvents(arr, ctx, onComplete){
  if(activeTimer){ clearTimeout(activeTimer); activeTimer=null; }
  let i=0;
  ctx = ctx || {};
  (function step(){
    if(i>=arr.length){ activeTimer=null; if(onComplete)onComplete(ctx); return; }
    const ev = arr[i];
    dispatch(ev, ctx);
    const wait = paceFor(ev);
    i++;
    activeTimer = setTimeout(step, ctx.fast ? Math.min(wait,8) : wait);
  })();
  return ctx;
}

/* ============================================================================
   strict-score panel (HARD) — human-readable assertion rows (Granola #3/#5)
   ========================================================================== */
function renderStrictScore(reward, demoModel){
  if(!reward) return el('div');
  const card = el('div','scorecard');
  const strict = reward.strict ?? 0, dense = reward.dense ?? 0;
  card.innerHTML =
    `<div class="scorehead">
       <div class="scorebig strict ${strict>=1?'one':'zero'}">${strict.toFixed(2)}
         <small>strict score — whole task done right?</small></div>
       <div class="scorebig dense">${dense.toFixed(2)}
         <small>partial credit — fraction of sub-steps that landed</small></div>
       <div class="chip ${strict>=1?'ok':'err'}">${strict>=1?'task completed':'task failed'}</div>
     </div>
     <div class="explainer">
       <b>Strict vs. partial.</b> <b>Strict</b> is all-or-nothing: every required step must be right —
       one wrong move (or one forbidden action) makes the whole task a <b>0</b>, even if most steps were fine.
       <b>Partial</b> counts how many sub-steps landed, so you can see <i>how close</i> the model got.
       Here strict reads <b>${strict.toFixed(2)}</b> but partial is <b>${dense.toFixed(2)}</b> — not a flat "fail",
       but not a finished job either.
     </div>`;
  (reward.breakdown||[]).forEach(a=>{
    const row=el('div','assertrow '+(a.pass?'pass':'fail'));
    if(a.id) row.dataset.aid = a.id;     // stamp the assertion id so the dissector can deep-link to this row
    row.innerHTML =
      `<span class="v">${a.pass?'PASS':'FAIL'}</span>
       <div class="body">
         <div class="lab">${esc(a.label)}${a.negative?'<span class="neg">must NOT</span>':''}</div>
         <div class="ea">expected <span class="exp">${esc(a.expected)}</span> · got <span class="act">${esc(a.actual)}</span></div>
         ${a.plain?`<div class="plain">${esc(a.plain)}</div>`:''}
       </div>`;
    card.appendChild(row);
  });
  return card;
}

/* ============================================================================
   roster table (every tier) — carries the AGGREGATE claim, not the single replay
   ========================================================================== */
function rosterTable(roster, opts){
  opts = opts || {};
  const t=el('table','tbl');
  let h='<tr><th>model</th><th class="num">strict</th><th class="num">partial</th><th class="num">cost / task</th><th class="num">tokens</th><th></th></tr>';
  (roster||[]).forEach(r=>{
    const passcls = r.pass===true?'pass-y':(r.strict>0||r.reward>0?'pass-p':'pass-n');
    const passtxt = r.pass===true?'pass':(r.reward>0||r.strict>0?'partial':'fail');
    h+=`<tr class="${r.model_class==='frontier'?'frontier':''}">`+
       `<td>${esc(r.model)}<span class="modelclass ${esc(r.model_class)}">${esc(r.model_class)}</span></td>`+
       `<td class="num">${(r.strict??r.reward??0).toFixed(2)}</td>`+
       `<td class="num">${(r.dense??r.reward??0).toFixed(2)}</td>`+
       `<td class="num">${fmtUsd(r.cost_usd_per_task)}</td>`+
       `<td class="num">${fmtK(r.tokens)}</td>`+
       `<td class="${passcls}">${passtxt}${r.note?` <span class="cls">(${esc(r.note)})</span>`:''}</td>`+
       `</tr>`;
  });
  t.innerHTML=h;
  return t;
}

/* token/cost note (Granola #5 — 18k vs 523k confusion pre-empted) */
function costNote(roster){
  const fr = (roster||[]).find(r=>r.model_class==='frontier');
  const sl = (roster||[]).find(r=>r.model_class==='small-local');
  const d=el('div','note');
  d.innerHTML = '<b>About cost &amp; tokens.</b> The local model runs on your laptop, so its dollar cost is effectively $0 — '+
    'you pay in time and memory, not API fees. Frontier models bill per token, and reasoning models can spend '+
    '<b>many times more tokens</b> "thinking" before they answer, so a higher token count is expected, not a bug. '+
    'Compare models on <b>cost per finished task</b>, not raw token counts.';
  return d;
}

/* ============================================================================
   TASK DISSECTOR — collapsible "what makes this hard" panel + inline glossary
   Additive & optional. Reads window.LADDER_ANATOMY (byTask / tierDefault / hardTasks)
   and window.LADDER_GLOSSARY (drivers / terms). If either is absent the panel no-ops
   and every glossify() call is a cheap walk that wraps nothing. No fetch; file://-safe.
   ========================================================================== */
const ANAT = (typeof window!=='undefined' && window.LADDER_ANATOMY) ? window.LADDER_ANATOMY : null;
const GLOSS = (typeof window!=='undefined' && window.LADDER_GLOSSARY) ? window.LADDER_GLOSSARY : null;

// one-entry alias: the renewal breakdown row uses the viewer id `mail_renewals_3808`,
// while the fixture/anatomy use `mail_renewals`. The deep-link tries both.
const ASSERT_ALIAS = { mail_renewals: 'mail_renewals_3808' };

function anatomyForTier(tier){
  if(!ANAT || !ANAT.byTask) return null;
  const dflt = (ANAT.tierDefault && ANAT.tierDefault[tier.id]) || null;
  return dflt && ANAT.byTask[dflt] ? dflt : null;   // returns a task_id (or null)
}

// resolve a glossary key → {term, gloss, why?} for the tooltip. Drivers first, then terms.
function glossResolve(key){
  if(!GLOSS) return null;
  const d = GLOSS.drivers && GLOSS.drivers[key];
  if(d) return { term: d.demoName || key, gloss: d.whatItMeans || d.short || '', why: d.whyItFails || '' };
  const t = GLOSS.terms && GLOSS.terms[key];
  if(t) return { term: t.term || key, gloss: t.gloss || '', why: '' };
  return null;
}

/* ---- the collapsible panel ---- */
function renderDissector(tier){
  const taskId0 = anatomyForTier(tier);
  if(!taskId0) return null;                       // no anatomy → render nothing

  const bodyId = 'dissect-body-'+tier.id;
  const wrap = el('div','dissect-wrap');

  const toggle = el('button','dissect-toggle');
  toggle.type='button';
  toggle.setAttribute('aria-expanded','false');
  toggle.setAttribute('aria-controls',bodyId);
  toggle.innerHTML = '<span class="glyph">+</span><span>dissect this task — what makes it hard</span>';

  const body = el('div','dissect-body'); body.id=bodyId; body.hidden=true;

  // HARD: a small task switcher (renewal · ap-approval · sla). EASY/MEDIUM: single task.
  const hardTasks = (tier.id==='hard' && ANAT.hardTasks && ANAT.hardTasks.length>1) ? ANAT.hardTasks : null;

  function fillBody(taskId){
    body.innerHTML='';
    if(hardTasks){
      const sw=el('div','dissect-tasks');
      hardTasks.forEach(tid=>{
        const a=(ANAT.byTask[tid])||{};
        const short = tid.replace(/^hard\./,'').replace(/_/g,'-');
        const chip=el('button','chip acc-toggle');
        chip.type='button';
        chip.textContent = short;
        chip.setAttribute('aria-pressed', tid===taskId ? 'true':'false');
        chip.title = a.title || tid;
        chip.onclick=()=>{ if(tid!==taskId) fillBody(tid); };
        sw.appendChild(chip);
      });
      body.appendChild(sw);
    }
    const a = ANAT.byTask[taskId];
    if(!a){ body.appendChild(el('div','note','(no anatomy for '+esc(taskId)+')')); return; }
    buildAnatomy(body, a);
    glossify(body);                               // re-gloss the (re)built panel
  }

  toggle.onclick=()=>{
    const open = toggle.getAttribute('aria-expanded')==='true';
    if(open){
      toggle.setAttribute('aria-expanded','false');
      toggle.querySelector('.glyph').textContent='+';
      body.hidden=true;
    }else{
      toggle.setAttribute('aria-expanded','true');
      toggle.querySelector('.glyph').textContent='–';   // en-dash glyph
      if(!body.dataset.built){ fillBody(taskId0); body.dataset.built='1'; }
      body.hidden=false;
    }
  };

  wrap.appendChild(toggle);
  wrap.appendChild(body);
  return wrap;
}

/* ---- build the anatomy body (summary → inputs → tools → success → drivers → footer) ---- */
function buildAnatomy(body, a){
  // 1. summary
  if(a.plain_summary){
    body.appendChild(el('div','dissect-summary', esc(a.plain_summary)));
  }

  // 2. inputs (+ classes nested for classifiers)
  if(a.inputs && a.inputs.length){
    body.appendChild(el('div','dissect-sect','what the model sees'));
    a.inputs.forEach(inp=>{
      const r=el('div','dissect-row');
      r.innerHTML='<span class="k">'+esc(inp.label)+'</span><span class="v">'+esc(inp.detail||'')+'</span>';
      body.appendChild(r);
    });
  }
  if(a.classes && a.classes.length){
    body.appendChild(el('div','dissect-sect','the label menu it must choose from'));
    const cl=el('div','dissect-classlist');
    a.classes.forEach(c=>{
      const r=el('div','dissect-row');
      r.innerHTML='<span class="k">'+esc(c.label)+'</span><span class="v">'+esc(c.means||'')+'</span>';
      cl.appendChild(r);
    });
    body.appendChild(cl);
  }

  // 3. tools — HARD only; EASY/MEDIUM show a single-turn note instead
  if(a.tools && a.tools.length){
    body.appendChild(el('div','dissect-sect','actions it can take (tools)'));
    a.tools.forEach(t=>{
      const r=el('div','dissect-row dissect-tool');
      r.innerHTML='<span class="k">'+esc(t.name)+'</span><span class="v">'+esc(t.does||'')+'</span>';
      body.appendChild(r);
    });
  } else {
    body.appendChild(el('div','note','<b>No tools</b> — this is a single-turn judgment: one input in, one label out.'));
  }

  // 4. success criteria
  if(a.success_criteria){
    body.appendChild(el('div','dissect-sect','done right = …'));
    body.appendChild(el('div','dissect-success', esc(a.success_criteria)));
  }

  // 5. difficulty drivers
  body.appendChild(el('div','dissect-sect','difficulty drivers — what makes it hard'));
  if(a.drivers && a.drivers.length){
    a.drivers.forEach(d=>body.appendChild(driverLine(d)));
  } else {
    body.appendChild(el('div','note','No hard drivers — this rung is the floor; exact-label match, nothing to trip on.'));
  }

  // MEDIUM worked example (after drivers)
  if(a.worked_example){
    const w=a.worked_example;
    const r=el('div','dissect-row');
    r.innerHTML='<span class="k">worked example</span><span class="v">'+
      '“'+esc(w.query)+'” → “'+esc(w.product)+'” → gold <b style="color:var(--good)">'+esc(w.gold)+'</b>'+
      (w.small_model_says?' (a small model says <b style="color:var(--bad)">'+esc(w.small_model_says)+'</b>)':'')+
      (w.why?' — '+esc(w.why):'')+'</span>';
    body.appendChild(r);
  }

  // 6. footer micro-caveat

/* ---- deep-link: scroll to + flash the matching .assertrow (alias-tolerant) ---- */
function jumpToAssertion(aid){
  const post = document.getElementById('post');
  const tryIds = [aid];
  if(ASSERT_ALIAS[aid]) tryIds.push(ASSERT_ALIAS[aid]);
  // also accept reverse alias (fixture id authored, viewer id rendered, or vice-versa)
  Object.keys(ASSERT_ALIAS).forEach(k=>{ if(ASSERT_ALIAS[k]===aid && !tryIds.includes(k)) tryIds.push(k); });

  let rowEl=null;
  if(post){
    for(const id of tryIds){
      rowEl = post.querySelector('.assertrow[data-aid="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
      if(rowEl) break;
    }
  }
  if(rowEl){
    rowEl.scrollIntoView({behavior:'smooth', block:'center'});
    rowEl.classList.add('assertrow--flash');
    setTimeout(()=>rowEl.classList.remove('assertrow--flash'), 1200);
  } else if(post){
    // strict-score panel not rendered yet (replay still running) — nudge toward it
    post.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

/* ============================================================================
   INLINE GLOSSARY — auto-underline glossed terms + one shared hover/click popover
   ========================================================================== */
const GL_SKIP = new Set(['SCRIPT','STYLE','BUTTON','A','INPUT','TEXTAREA','CODE']);
const GL_SKIP_CLASS = ['gl','bubble','toolcall','toolresult','reason','content','driver-where','dissect-toggle','driver-jump'];

// precompute alias list (lowercased, longest-first so "strict mode" beats "strict")
let GL_ALIASES = null;
function buildAliasIndex(){
  if(GL_ALIASES || !GLOSS || !GLOSS.terms) { GL_ALIASES = GL_ALIASES || []; return; }
  const out=[];
  Object.keys(GLOSS.terms).forEach(key=>{
    const t=GLOSS.terms[key];
    const aliases = (t.aliases && t.aliases.length) ? t.aliases : [t.term||key];
    aliases.forEach(al=>{ if(al) out.push({ key, alias:String(al).toLowerCase() }); });
  });
  out.sort((a,b)=>b.alias.length-a.alias.length);   // longest alias wins
  GL_ALIASES = out;
}

function glInSkippedAncestor(node){
  let p=node.parentNode;
  while(p && p.nodeType===1){
    if(GL_SKIP.has(p.tagName)) return true;
    const cl=p.classList;
    if(cl){ for(const c of GL_SKIP_CLASS){ if(cl.contains(c)) return true; } }
    p=p.parentNode;
  }
  return false;
}

// wrap the FIRST occurrence (per scope) of each alias in a text node with a .gl span.
// first-occurrence-only keeps the page austere (terms aren't underlined a dozen times).
function glossify(scope){
  if(!scope || !GLOSS) return;
  buildAliasIndex();
  if(!GL_ALIASES.length) return;

  const seen = new Set();   // alias-key already linked within this scope → link once
  // pre-mark explicit data-gl spans as "seen" so the auto-pass doesn't double-wrap the same concept
  scope.querySelectorAll('.gl[data-gl]').forEach(s=>seen.add(s.getAttribute('data-gl')));

  const walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if(glInSkippedAncestor(n)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[]; let cur;
  while((cur=walker.nextNode())) nodes.push(cur);

  nodes.forEach(node=>{
    let text = node.nodeValue;
    const lower = text.toLowerCase();
    // find the earliest not-yet-seen alias in this text node
    let best=null;
    for(const entry of GL_ALIASES){
      if(seen.has(entry.key)) continue;
      const idx = lower.indexOf(entry.alias);
      if(idx<0) continue;
      // word-ish boundary check (avoid matching inside a larger word)
      const before = idx===0 ? ' ' : text[idx-1];
      const after  = (idx+entry.alias.length>=text.length) ? ' ' : text[idx+entry.alias.length];
      if(/[a-z0-9]/i.test(before) || /[a-z0-9]/i.test(after)) continue;
      if(!best || idx<best.idx || (idx===best.idx && entry.alias.length>best.len)){
        best={ key:entry.key, idx, len:entry.alias.length };
      }
    }
    if(!best) return;
    seen.add(best.key);

    const span=el('span','gl');
    span.setAttribute('data-gl', best.key);
    span.setAttribute('tabindex','0');
    span.setAttribute('role','button');
    span.textContent = text.substr(best.idx, best.len);

    const frag=document.createDocumentFragment();
    if(best.idx>0) frag.appendChild(document.createTextNode(text.substr(0,best.idx)));
    frag.appendChild(span);
    const tailStart=best.idx+best.len;
    if(tailStart<text.length) frag.appendChild(document.createTextNode(text.substr(tailStart)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* ---- the shared popover (one element, lazily created; never more than one open) ---- */
let glPop=null, glOpenTimer=null, glCloseTimer=null, glPinned=false, glActive=null;
function glEnsurePop(){
  if(glPop) return glPop;
  glPop=el('div'); glPop.id='gl-pop'; glPop.hidden=true;
  glPop.addEventListener('mouseenter',()=>{ if(glCloseTimer){clearTimeout(glCloseTimer);glCloseTimer=null;} });
  glPop.addEventListener('mouseleave',()=>{ if(!glPinned) glScheduleClose(); });
  document.body.appendChild(glPop);
  return glPop;
}
function glFill(key){
  const r=glossResolve(key);
  if(!r) return false;
  const pop=glEnsurePop();
  pop.innerHTML='<b class="gl-term"></b><span class="gl-body"></span>'+(r.why?'<span class="gl-why"></span>':'');
  pop.querySelector('.gl-term').textContent=r.term;
  pop.querySelector('.gl-body').textContent=r.gloss;
  if(r.why){
    // scoring-mechanic drivers carry a "Not a failure mode…" note; don't label it "why it fails"
    const lead = /^not a failure mode/i.test(r.why.trim()) ? 'note: ' : 'why it fails: ';
    pop.querySelector('.gl-why').textContent=lead+r.why;
  }
  return true;
}
function glPosition(target){
  const pop=glEnsurePop();
  pop.hidden=false; pop.style.left='0px'; pop.style.top='0px';   // measure
  const r=target.getBoundingClientRect();
  const pr=pop.getBoundingClientRect();
  const sx=window.scrollX||window.pageXOffset, sy=window.scrollY||window.pageYOffset;
  let left = r.left + sx;
  let top  = r.bottom + sy + 6;
  const margin=8, vw=document.documentElement.clientWidth;
  if(left+pr.width > vw-margin) left = Math.max(margin, vw-margin-pr.width);
  if(left<margin) left=margin;
  // flip above if it would overflow the bottom of the viewport
  if(r.bottom + 6 + pr.height > (window.innerHeight||document.documentElement.clientHeight) - margin){
    top = r.top + sy - pr.height - 6;
  }
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function glOpen(target,pin){
  const key=target.getAttribute('data-gl');
  if(!glFill(key)) return;
  glActive=target;
  if(pin){ glPinned=true; glEnsurePop().classList.add('pinned'); }
  glPosition(target);
  target.setAttribute('aria-describedby','gl-pop');
}
function glClose(){
  if(glOpenTimer){clearTimeout(glOpenTimer);glOpenTimer=null;}
  glPinned=false;
  if(glPop){ glPop.hidden=true; glPop.classList.remove('pinned'); }
  if(glActive){ glActive.removeAttribute('aria-describedby'); glActive=null; }
}
function glScheduleClose(){ if(glCloseTimer)clearTimeout(glCloseTimer); glCloseTimer=setTimeout(()=>{ if(!glPinned) glClose(); },140); }

// global delegated handlers (work for spans added at any time, incl. re-rendered beats)
document.addEventListener('mouseover',e=>{
  const t=e.target.closest && e.target.closest('.gl[data-gl]');
  if(!t) return;
  if(glCloseTimer){clearTimeout(glCloseTimer);glCloseTimer=null;}
  if(glPinned && glActive===t) return;
  if(glOpenTimer)clearTimeout(glOpenTimer);
  glOpenTimer=setTimeout(()=>{ if(!glPinned) glOpen(t,false); },120);
});
document.addEventListener('mouseout',e=>{
  const t=e.target.closest && e.target.closest('.gl[data-gl]');
  if(!t) return;
  if(glOpenTimer){clearTimeout(glOpenTimer);glOpenTimer=null;}
  if(!glPinned) glScheduleClose();
});
document.addEventListener('focusin',e=>{
  const t=e.target.closest && e.target.closest('.gl[data-gl]');
  if(t) glOpen(t,false);
});
document.addEventListener('focusout',e=>{
  const t=e.target.closest && e.target.closest('.gl[data-gl]');
  if(t && !glPinned) glScheduleClose();
});
document.addEventListener('click',e=>{
  const t=e.target.closest && e.target.closest('.gl[data-gl]');
  if(t){
    e.preventDefault();
    if(glPinned && glActive===t){ glClose(); }
    else { glPinned=false; glOpen(t,true); }
    return;
  }
  // click outside an open pinned popover closes it
  if(glPinned && glPop && !glPop.contains(e.target)) glClose();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && glPop && !glPop.hidden){
    const ret=glActive; glClose(); if(ret&&ret.focus)ret.focus();
  }
  // Enter/Space on a focused term toggles pin (it's role=button)
  if((e.key==='Enter'||e.key===' ') && document.activeElement &&
      document.activeElement.classList && document.activeElement.classList.contains('gl')){
    e.preventDefault();
    const t=document.activeElement;
    if(glPinned && glActive===t) glClose(); else { glPinned=false; glOpen(t,true); }
  }
});

/* ---- EASY / MEDIUM / HARD tier beat ---- */
function renderTierBeat(tier, idx){
  const root = $('#beat'); root.innerHTML='';
  root.appendChild(beatHeader(tier));

  // task dissector — collapsible, closed by default (no-ops if anatomy data is absent)
  const dissect = renderDissector(tier);
  if(dissect) root.appendChild(dissect);

  // why-it-matters (Granola #1 — every beat says WHAT and WHY)

  root.appendChild(why);

    const yg=el('div','why you-get-it');
    yg.innerHTML=`<span class="lbl">the intuition</span>${esc(tier.you_get_it)}`;
    root.appendChild(yg);
  }

  // escalation framing announced at the MEDIUM / HARD transitions (checklist item 3)
  if(tier.id==='medium'){
    const e=el('div','why escalate');
    e.innerHTML='<span class="lbl">heads up — the ladder gets harder on purpose</span>'+
      'This is a deliberate difficulty ladder. We keep raising the bar until a small/local model visibly breaks, '+
      'so you can see <b>where</b> the line is — not whether small models are "good" or "bad" in the abstract.';

  }
  if(tier.id==='hard'){
    const e=el('div','why escalate');
    e.innerHTML='<span class="lbl">this is the hard rung — multi-step tool use</span>'+
      'Now the model can\'t just answer in words — it has to <b>do</b> a multi-step job by calling tools '+
      '(looking up an account, reading a policy email, updating a record, sending mail) and get the <b>final state</b> right. '+
      'This is where small/local models tend to break, and where the frontier earns its keep.';
    root.appendChild(e);
  }

  // tool-calling primer (HARD only) — assume ZERO fluency (Granola #3)
  if(tier.id==='hard'){
    const p=el('div','explainer');
    p.style.margin='4px 0 8px';
    p.innerHTML='<b>What is a "tool call"?</b> Instead of only writing text, the model is handed a set of buttons it can press — '+
      'each one looks up or changes something in a (synthetic) business system: <i>find an account</i>, <i>read an email</i>, '+
      '<i>update a subscription</i>, <i>send mail</i>. We show every button it presses, the arguments it passes, and what came back. '+
      'The task is scored on the <b>end state of the world</b>, not on what the model <i>said</i> it did.';
    root.appendChild(p);
  }

  // stage tracker
  const stages = (tier.id==='hard')
    ? [{s:'prompt',b:'prompt',small:'the job'},{s:'policy',b:'model',small:'thinks + acts'},
       {s:'env',b:'tools',small:'business systems'},{s:'parser',b:'final state',small:'what changed'},
       {s:'rubric',b:'score',small:'strict + partial'}]
    : [{s:'prompt',b:'prompt',small:'one item'},{s:'policy',b:'model',small:'reads it'},
       {s:'env',b:'—',small:''},{s:'parser',b:'label',small:'its answer'},
       {s:'rubric',b:'score',small:'vs gold'}];
  root.appendChild(stageLoop(stages));

  // representative-run label (Granola — claim lives in aggregate, not the single replay)
  const repLabel = el('div','note');
  repLabel.style.color='var(--dim2)';
  repLabel.innerHTML = '<span class="chip">one representative run · '+esc(tier.demo_model)+
    '<span class="modelclass '+esc(tier.demo_model_class)+'">'+esc(tier.demo_model_class)+'</span></span> '+
    'Watch one run below. The headline number is the <b>rate across many items</b> in the table underneath — never this single run.';
  root.appendChild(repLabel);

  // transcript stream
  streamEl = el('div'); streamEl.id='stream';
  root.appendChild(streamEl);
  clearStream(); resetStages();

  // post-replay area (filled when replay completes): score panel / aggregate / roster
  const post = el('div'); post.id='post'; root.appendChild(post);

  // gate
  const gate = el('div','gate');
  root.appendChild(gate);

  // drive the replay, then reveal the post area + gate
  const ctx = { toolGloss: (tier.id==='hard'
      ? 'Each line below is the model pressing one of those buttons. Green means the system accepted it; red means it errored.'
      : null),
    onDone: null };
  setStage('prompt','on');

  // gloss every glossary term in the static beat copy (dissector panel + why blocks +
  // explainers) once it's all rendered. The streaming transcript is skipped by glossify's
  // own skip-list (.bubble/.toolcall/etc.), so this is safe to run before the replay.
  glossify(root);

  replayEvents(tier.replay||[], ctx, (c)=>{
    // ----- post-replay content -----
    if(tier.id==='hard'){
      post.appendChild(el('div','sect','what the strict scorer checked'));
      post.appendChild(renderStrictScore(c.reward || lastReward(tier), tier.demo_model));
    }
    if(tier.id==='medium' && tier.aggregate){
      post.appendChild(el('div','sect','the real result — a rate across many items, not this one run'));
      post.appendChild(renderAggregate(tier.aggregate));
    }
    // roster + scoring note + cost note for every tier
    post.appendChild(el('div','sect','every model on this rung'));
    if(tier.scoring_note){
      const sn=el('div','note'); sn.innerHTML='<b>Scoring.</b> '+esc(tier.scoring_note); post.appendChild(sn);
    }
    post.appendChild(rosterTable(tier.roster));
    post.appendChild(costNote(tier.roster));

    // unlock next rung + show gate
    maxUnlocked = Math.max(maxUnlocked, idx+1);
    renderRail();
    const nextLabel = RUNGS[idx+1] ? RUNGS[idx+1].label : null;
    gate.innerHTML='';
    if(nextLabel){
      const b=el('button',null,`next → ${esc(nextLabel)}`);
      b.onclick=()=>goTo(idx+1);
      gate.appendChild(b);
      const hint=el('span','gatehint',
        tier.id==='easy' ? 'next we raise the difficulty — watch the models start to diverge'
        : tier.id==='medium' ? 'next is the hard rung: multi-step tool use, scored on the final state'
        : '');
      gate.appendChild(hint);
    }
    // replay-again affordance
    const again=el('button','secondary','↻ replay this run');
    again.onclick=()=>{ goTo(idx); };
    gate.appendChild(again);

    // gloss the freshly-rendered post-replay copy (strict-score explainer, .plain rows,
    // scoring/cost notes). The transcript above is untouched (skip-list guards it).
    glossify(post);
  });
}

function lastReward(tier){
  // fallback: synthesize a reward from the tier's replay if the ctx didn't capture it
  const rw=(tier.replay||[]).find(e=>e.type==='reward');
  return rw || {strict:0,dense:0,breakdown:[]};
}

/* ============================================================================
   SPECTRUM beat — heatmap, headline + ferrari, open/closed tally, allocation
   ========================================================================== */
function heatColor(v){
  // 0 -> red, 0.5 -> gold, 1 -> green  (clamped)
  const x=Math.max(0,Math.min(1,v));
  let r,g,b;
  if(x<0.5){ const t=x/0.5; r=248; g=Math.round(81+(153-81)*t); b=Math.round(73+(34-73)*t); }
  else { const t=(x-0.5)/0.5; r=Math.round(210-(210-63)*t); g=Math.round(153+(185-153)*t); b=Math.round(34+(80-34)*t); }
  return `rgb(${r},${g},${b})`;
}
function taskPlain(taskId){
  return ({
    'easy.email_triage':       'read an email → pick one of five mailboxes',
    'medium.relevance_grade':  'is this product an exact match, a substitute, a complement, or irrelevant?',
    'hard.renewal_save_route': 'run a multi-step "save" play and get the final records + emails right',
    'hard.ap_approval_threshold':'approve or escalate an invoice using the latest policy threshold',
    'hard.sla_route':          'route a ticket correctly once its SLA deadline has passed',
  })[taskId] || taskId;
}

function renderSpectrumBeat(){

    'and one hard rung (the small model breaks). Here is the whole picture at once.'));

  // (a) heatmap — hardest LAST
  root.appendChild(el('div','sect','every model × every task (easiest at top, hardest at bottom)'));
  const models = sp.models || [];
  const heat=el('div','heat');
  let ht='<table class="heatmap"><tr><th class="tasklabel">task</th>';
  models.forEach(m=>{ ht+=`<th>${esc(m)}<br><span style="color:var(--dim2);font-weight:400">${esc((sp.model_class||{})[m]||'')}</span></th>`; });
  ht+='</tr>';
  (sp.tasks_by_difficulty||[]).forEach(row=>{
    ht+=`<tr class="hrow ${esc(row.tier)}"><td class="tasklabel"><b>${esc(row.task)}</b><small>${esc(taskPlain(row.task))}</small></td>`;
    models.forEach(m=>{
      const v=(row.scores||{})[m];              // STRICT score — drives the color
      const p=(row.partial||{})[m];             // partial/dense score (optional)
      const c=heatColor(v==null?0:v);
      // show partial as a small sub-note ONLY when strict is 0 but the model still
      // landed some sub-steps — so "strict" and "partial" are never one merged number.
      const showPartial = (v!=null && v===0 && p!=null && p>0);
      const sub = showPartial ? `<span class="hpartial">partial ${p.toFixed(2)}</span>` : '';
      const tip = `${esc(m)} on ${esc(row.task)}: strict ${v==null?'—':v.toFixed(2)}`
                + (p!=null ? ` · partial ${p.toFixed(2)}` : '');
      ht+=`<td><span class="hcell" style="background:${c}" title="${esc(tip)}">${v==null?'—':v.toFixed(2)}${sub}</span></td>`;
    });
    ht+='</tr>';
  });
  ht+='</table>';
  heat.innerHTML=ht;
  root.appendChild(heat);
  const leg=el('div','heatlegend');
  leg.innerHTML='<span><span class="sw" style="background:'+heatColor(0)+'"></span>0.0 — breaks</span>'+
    '<span><span class="sw" style="background:'+heatColor(0.5)+'"></span>0.5 — partial</span>'+
    '<span><span class="sw" style="background:'+heatColor(1)+'"></span>1.0 — clears it</span>'+
    '<span style="color:var(--dim2)">color = <b>strict</b> score (whole task done right). '+
    'Where a model scored strict 0 but still landed a few sub-steps, the smaller '+
    '"<b>partial</b>" number under the cell shows how far it got.</span>';
  root.appendChild(leg);

  // (b) headline + ferrari lines
  const hl = sp.headline || {};
  const hd=el('div','headline');
  let hh = `<div class="one">${esc(hl.one_liner||'')}</div>`;
  const fr = hl.ferrari_lines||{};
  hh+='<div class="ferrari">';
  if(fr.grocery)  hh+=`<div class="fl"><span class="ic">🛒</span><div>${esc(fr.grocery)}</div></div>`;
  if(fr.highway)  hh+=`<div class="fl"><span class="ic">🏎️</span><div>${esc(fr.highway)}</div></div>`;
  if(fr.cheap_fix)hh+=`<div class="fl"><span class="ic">🔧</span><div>${esc(fr.cheap_fix)}</div></div>`;
  hh+='</div>';
  hd.innerHTML=hh;
  root.appendChild(hd);

  // (c) open-vs-closed tally — the LEAD signal (paired, tier-mix independent)
  const oc = sp.open_closed || {};
  root.appendChild(el('div','sect','open / local vs. frontier — head to head, task by task'));
  const tally=el('div','tally');
  tally.innerHTML =
    `<div class="note" style="margin:0 0 4px">We pit the best open/local model against the frontier on each task and ask: who wins? `+
    `(This is a paired, per-task tally — it doesn\'t depend on how many easy vs. hard tasks we picked.)</div>
     <div class="tallybars">
       <div class="tb open"><div class="n">${oc.open_wins??0}</div><div class="l">open wins</div></div>
       <div class="tb tie"><div class="n">${oc.ties??0}</div><div class="l">ties</div></div>
       <div class="tb closed"><div class="n">${oc.closed_wins??0}</div><div class="l">frontier wins</div></div>
     </div>
     <div class="note">${esc(oc.plain||'')}</div>`;
  root.appendChild(tally);

  // (d) allocation / routing table
  root.appendChild(el('div','sect','what this means for routing — task by task'));
  const at=el('table','tbl');
  let aht='<tr><th>task</th><th>cheapest model that\'s good enough</th><th class="num">cost / task</th><th class="num">saving</th></tr>';
  (sp.allocation||[]).forEach(a=>{
    const ca=a.cheapest_adequate||{};
    aht+=`<tr><td>${esc(a.task)}<small class="cls" style="display:block">${esc(taskPlain(a.task))}</small></td>`+
      (a.frontier_needed
        ? `<td><b style="color:var(--gold)">frontier needed</b> — ${esc(ca.model||'')}</td>`
        : `<td>${esc(ca.model||'')} <span class="cls">(open/local good enough)</span></td>`)+
      `<td class="num">${fmtUsd(ca.cost_usd_per_task)}</td>`+
      `<td class="num">${a.frontier_needed?'—':(a.saving_vs_best_pct+'%')}</td></tr>`;
  });
  at.innerHTML=aht;
  root.appendChild(at);
  if(hl.routable_pct!=null){
    const rp=el('div','note');
    rp.innerHTML=`Across <b>this synthetic ladder</b>, ${hl.routable_pct}% of task types can run on an open/local model `+
      `(cheapest that keeps up: <b>${esc(hl.cheapest_routable_model||'')}</b>); the other ${hl.frontier_only_pct}% are the hard multi-tool tail that still needs the frontier. `+
      `<i>This is a synthetic illustration — your real split depends on your real workload.</i>`;
    root.appendChild(rp);
  }

  // (e) Door-A CTA
  const cta = sp.cta || {label:'Run this on YOUR tasks', plain:'', skill:'understand-workload'};
  const ctad=el('div','cta');
  ctad.innerHTML =
    `<h2>${esc(cta.label)}</h2>
     <p>${esc(cta.plain||'This was synthetic. Point Understudy at your real prompts, traces, or dataset to measure the same spectrum on your own workload — with real numbers, not look-alikes.')}</p>`;
  const go=el('button','big',`${esc(cta.label)} →`);
  go.onclick=()=>{
    const msg = `I've watched the no-data ladder. I have data now — run the "${cta.skill||'understand-workload'}" door on my own workload so we can measure this spectrum on my real tasks.`;
    if(typeof sendPrompt==='function'){ try{ sendPrompt(msg); return; }catch(e){} }
    // file:// fallback: no chat host available
    go.textContent='copy this to your agent ↓';
    const box=el('div','smallcaveat'); box.style.userSelect='text';
    box.textContent=msg; ctad.appendChild(box);
  };
  ctad.appendChild(go);
  ctad.appendChild(el('div','smallcaveat',
    'Reminder: everything above was synthetic Larkfield data, scored locally with no LLM judge (seed '+L.seed+', temperature '+L.temperature+'). It is directional — not a savings claim about your app.'));
  root.appendChild(ctad);

  // gate back
  const gate=el('div','gate');
  const b=el('button','secondary','↻ start the ladder over');
  b.onclick=()=>goTo(0);
  gate.appendChild(b);
  root.appendChild(gate);

  maxUnlocked = Math.max(maxUnlocked, RUNGS.length-1);
  renderRail();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================================
   navigation
   ========================================================================== */
function goTo(idx){
  if(idx>maxUnlocked) return;       // gated advance
  if(activeTimer){ clearTimeout(activeTimer); activeTimer=null; }
  current = idx;
  renderRail();
  window.scrollTo({top:0,behavior:'smooth'});
  const rung = RUNGS[idx];
  if(rung.id==='spectrum'){ renderSpectrumBeat(); return; }
  const tier = tierById(rung.id);
  if(tier){ renderTierBeat(tier, idx); }
}

/* ============================================================================
   boot
   ========================================================================== */
function validateFixture(){
  // light, non-fatal invariant checks surfaced in the console (Granola #6 / build contract §1)
  const warn=[];
  if(L.synthetic!==true) warn.push('synthetic should be true');
  if(L.judge_model!==null) warn.push('judge_model should be null (no LLM judge)');
  if(L.seed!==7) warn.push('seed should be 7');
  if(L.temperature!==0.0 && L.temperature!==0) warn.push('temperature should be 0.0');
  const ids=(L.tiers||[]).map(t=>t.id).join(',');
  if(ids!=='easy,medium,hard') warn.push('tiers must be exactly easy,medium,hard (got: '+ids+')');
  const banned=/sha256|validated_on_holdout|candidate_sha256|claim_supported|sample_size/;
  if(banned.test(JSON.stringify(L))) warn.push('found claim-grade key that must not appear in a ladder_report');
  if(warn.length) console.warn('[ladder] fixture warnings:', warn);
  else console.info('[ladder] fixture passes ladder_report.v1 invariants (synthetic, seed 7, temp 0, no judge).');
}

if(L){
  renderChrome();
  validateFixture();
  goTo(0);
}
</script>
