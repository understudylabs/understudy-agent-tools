<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>understudy · no-data ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F2ED; --ink:#0A0A0A; --muted:#6B6862; --faint:#9A958C;
    --rule:#D9D4CA; --stamp:#B24A2E;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:48px 28px 80px}
  .mast{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);border-bottom:.5px solid var(--rule);padding-bottom:14px}
  .mast b{color:var(--ink);font-weight:500}
  .mast .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .problem{font-family:var(--sans);font-size:21px;font-weight:500;line-height:1.4;margin:34px 0 28px}
  .field{margin:0 0 22px}
  .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .val{white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--ink)}
  .resp{font-family:var(--sans);font-size:16px}
  .verdict{font-size:13px;color:var(--muted);margin-top:4px}
  .miss{color:var(--stamp)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><span><b>understudy</b> · no-data ladder</span><span class="meta" id="meta"></span></div>

  <div class="problem" id="problem"></div>

  <div class="field"><div class="lbl">system prompt</div><div class="val" id="system"></div></div>
  <div class="field"><div class="lbl">user prompt</div><div class="val" id="user"></div></div>
  <div class="field"><div class="lbl">response</div><div class="val resp" id="response"></div></div>
  <div class="verdict" id="verdict"></div>
</div>

<script src="ladder.climb.data.js"></script>
<script>
(function(){
  var C = window.CLIMB;
  var $ = function(id){ return document.getElementById(id); };
  if(!C){ $('problem').textContent = 'Could not load ladder.climb.data.js (keep it next to index.html).'; return; }

  var t = C.tasks[0];                 // one task for now — the easy one
  var run = t.runs[C.models[0].id];   // one model for now — the small local one

  $('meta').textContent = t.tier + ' · synthetic';
  $('problem').textContent = t.title;
  $('system').textContent = t.system;
  $('user').textContent = t.input;
  $('response').textContent = run.output || '';
  $('verdict').textContent = run.correct ? 'matched the answer.' : 'missed it.';
  if(!run.correct){ $('verdict').className = 'verdict miss'; }
})();
</script>
</body>
</html>
